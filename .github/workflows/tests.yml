# Автоматическая проверка на GitHub при каждом push в main и в каждом PR
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Скачать код репозитория на виртуальную машину GitHub
      - uses: actions/checkout@v5

      # Та же версия Python, что и локально
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      # Тесты работают на сохранённых страницах — интернет не нужен
      - name: Запустить тесты
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Собрать Docker-образ
        run: docker build -t catalog_parser .

      # Образ запускается, Scrapy и настройки сайтов на месте
      - name: Проверить образ
        run: |
          docker run --rm catalog_parser --help
          docker run --rm --entrypoint python catalog_parser -c "import catalog.spider; from catalog.config import load_sites; from pathlib import Path; print([s.name for s in load_sites(Path('sites'))])"
